<div class="rule-canvas-scale" ref="ruleCanvasScale" :style="{gridTemplateColumns: ruleWirePlan.gaps.map(gap => gap + 'px minmax(0, 1fr)').join(' ')}">
    <div v-for="(region, column) in ruleContactRegions" :key="region.name" class="rule-region"
         :style="{gridColumn: 2 * column + 2, gridRow: '1 / span ' + region.rowCount}">
        <div class="rule-region-title">
            <strong v-text="region.title"></strong>
            <span v-text="region.contacts.length + ' 个触点'"></span>
        </div>
        <template v-for="contact in region.contacts" :key="contact.name">
            <div v-if="contact.groupTitle" class="rule-component-name" :style="{gridRow: contact.row - 1, marginTop: (ruleWirePlan.rowSpacing[contact.row - 1] || 0) + 'px'}" v-text="contact.groupTitle"></div>
            <button type="button" class="rule-contact"
                    :ref="el => setRuleContactRef(contact.name, el)"
                    :style="{gridRow: contact.row, marginTop: (ruleWirePlan.rowSpacing[contact.row] || 0) + 'px'}"
                    :title="contact.name"
                    {% if review_mode|default(false) %}disabled :data-contact="contact.name"
                    {% else %}:class="{selected: ruleBuilder.selectedContact === contact.name}"
                    :aria-pressed="ruleBuilder.selectedContact === contact.name"
                    @click="handleRuleContactClick(contact.name)"{% endif %}>
                <span class="rule-socket" aria-hidden="true"></span>
                <span v-text="contact.name"></span>
                <span class="rule-socket" aria-hidden="true"></span>
            </button>
        </template>
    </div>
</div>
