<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>接线回顾 · {{ name }}</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <style>
    body {background:#f3f7f6;color:#173631}
    main {max-width:68rem;margin:auto;padding:2rem 1rem}
    article {background:white;border:1px solid #cadbd4;border-radius:1rem;padding:clamp(1rem,3vw,2rem)}
    canvas {display:block;width:100%;border:1px solid #ccdcd5;border-radius:.5rem;background:#f8fbfa}
    .board {max-height:60vh;overflow:auto}
    .controls {display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
    input[type=range] {flex:1;min-width:8rem;accent-color:#187348}
    .embedded {background:#f8fafc;color:#25334a}
    .embedded main {padding:0}
    .embedded article {padding:.75rem;border-color:#dbe3ee}
    .embedded .board {max-height:48vh}
  </style>
</head>
<body{% if not scores_url %} class="embedded"{% endif %}><main>
  {% if scores_url %}
    <a href="{{ scores_url }}" class="link-success">← 返回成绩可视化</a>
    <h1 class="h3 my-3">{{ name }} · 接线回顾</h1>
  {% endif %}
  <article>
    <p>学号 {{ record.metadata.student_no }}　考试编号 {{ record.metadata.test_id }}{% if record.metadata.simulated is sameas true %}　<span class="badge text-bg-secondary">模拟记录</span>{% endif %}</p>
    <div class="board"><canvas id="board" aria-label="端子连接示意图"></canvas></div>
    <p class="my-3" id="description" aria-live="polite"></p>
    <div class="controls">
      <button id="play" class="btn btn-success">播放</button>
      <button id="prev" class="btn btn-outline-secondary">上一步</button>
      <button id="next" class="btn btn-outline-secondary">下一步</button>
      <input id="seek" type="range" min="0" value="0" aria-label="回放进度">
      <label>速度 <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    </div>
    <p id="score" class="small text-secondary mt-3 mb-0"></p>
  </article>
</main>
<script type="application/json" id="record">{{ record|tojson }}</script>
<script src="/static/js/wiring-review.js"></script>
</body></html>
