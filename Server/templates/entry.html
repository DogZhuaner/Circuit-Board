<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>入口选择 · 电路配盘接线系统</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <style>
    .login-container { padding: clamp(1.5rem, 6vw, 2.5rem); }
    .logout-form { display: flex; justify-content: flex-end; margin-bottom: .75rem; }
    .login-title { margin-bottom: .5rem; font-size: clamp(1.55rem, 6vw, 2.2rem); }
    .entry-hint, #exam-status { color: var(--text-secondary); text-align: center; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .actions .btn-custom { padding: 14px 12px; text-align: center; text-decoration: none; }
    .actions .btn-login:disabled { background: var(--border-color); color: #475569; box-shadow: none; transform: none; cursor: not-allowed; }
    .scores-link { display: block; text-align: center; padding: .75rem; border: 1px solid var(--border-color); border-radius: 16px; color: var(--primary-dark); text-decoration: none; font-weight: 600; }
    .scores-link:hover { background: var(--light-bg); }
    .form-select:focus, .actions :focus-visible { outline: 3px solid var(--primary-color); outline-offset: 3px; }
  </style>
<script src="/static/js/session-navigation.js" defer></script>
</head>
<body>
  <main class="login-container">
    <form class="logout-form" method="post" action="{{ url_for('logout') }}">
      <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>退出登录</button>
    </form>
    <h1 class="login-title">{{ student.name }}{% if not student.name.endswith('同学') %}同学{% endif %}，你好！</h1>
    <p class="entry-hint mb-4">请选择考试、练习或查看成绩</p>
    {% if notice %}<p class="alert alert-warning">{{ notice }}</p>{% endif %}
    <form method="get" action="{{ url_for('student_entry') }}">
      <input type="hidden" name="mode" value="exam">
      <div id="exam-list" class="mb-3" hidden>
        <label class="form-label" for="exam-id">选择考试</label>
        <select class="form-select" id="exam-id" name="exam_id"></select>
      </div>
      <div class="actions">
        <button type="submit" id="exam-button" class="btn-custom btn-login" disabled>
          <i class="bi bi-pencil-square me-1"></i>考试
        </button>
        <a class="btn-custom btn-face-detection" href="{{ url_for('student_entry', mode='practice') }}"><i class="bi bi-tools me-1"></i>练习</a>
      </div>
      <p id="exam-status" role="status" class="mt-3">正在查询可参加的考试…</p>
    </form>
    <a class="scores-link" href="{{ url_for('student_scores') }}"><i class="bi bi-graph-up me-1" aria-hidden="true"></i>成绩数据可视化</a>
  </main>
  <script>
    const select = document.getElementById('exam-id');
    const button = document.getElementById('exam-button');
    const status = document.getElementById('exam-status');
    const list = document.getElementById('exam-list');
    let checking = false;
    let entering = false;
    let failure = '';
    let prepared = null;

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
        signal: AbortSignal.timeout(20000)
      });
      if (response.status === 404) throw new Error('接口不可用，请确认本机网关与服务端版本一致');
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || '请求失败，请重试');
      return result;
    }
    async function downloadSelection(enter) {
      if (entering || !select.value) return;
      entering = true;
      failure = '';
      select.disabled = button.disabled = true;
      const id = select.value;
      const api = '/api/exams/' + encodeURIComponent(id);
      status.textContent = '正在确认本机考试规则…';
      try {
        if (!prepared || prepared.id !== id || prepared.expires <= Date.now()) {
          const bundle = await postJson(api + '/prepare', {});
          prepared = {id, bundle, expires: Date.now() + 120000};
        }
        const gateway = localStorage.getItem('local_client_base') || {{ local_client_base|tojson }};
        const local = await postJson(gateway + '/api/exam/prepare', {
          test_id: id, student_no: prepared.bundle.student_no, rule_ticket: prepared.bundle.rule_ticket
        });
        if (!local.supports_exit_submission) throw new Error('请更新本机接线网关，以启用关闭考试页时自动交卷');
        if (!local.receipt) throw new Error('本机网关未确认规则已保存');
        if (enter) {
          const entry = await postJson(api + '/enter', {receipt: local.receipt});
          location.assign(entry.url);
          return;
        }
        status.textContent = '规则已下载到本机，可以进入考试';
      } catch (error) {
        prepared = null;
        failure = '无法进入考试：' + (error instanceof TypeError || error.name === 'TimeoutError'
          ? '规则下载连接失败，请检查网络和学生机网关，再点击考试重试。' : error.message);
        status.textContent = failure;
      }
      select.disabled = button.disabled = entering = false;
    }
    select.addEventListener('change', () => downloadSelection(false));
    button.form.addEventListener('submit', event => {
      event.preventDefault();
      downloadSelection(true);
    });

    async function refreshExams() {
      if (checking || entering) return;
      checking = true;
      try {
        const response = await fetch('/api/exams/open', { cache: 'no-store' });
        if (response.status === 401) { location.replace({{ url_for('login_page')|tojson }}); return; }
        if (!response.ok) throw new Error();
        const { exams } = await response.json();
        if (entering) return;
        const previous = select.value;
        select.replaceChildren(...exams.map(exam => {
          const label = exam.deadline === '9999-12-31 23:59:59' ? exam.name : exam.name + ' · 截至 ' + exam.deadline;
          return new Option(label, exam.id);
        }));
        if (exams.some(exam => String(exam.id) === previous)) select.value = previous;
        list.hidden = exams.length === 0;
        button.disabled = exams.length === 0;
        if (prepared && prepared.id !== select.value) prepared = null;
        status.textContent = exams.length ? (failure || (prepared ? '规则已下载到本机，可以进入考试' : '当前可参加 ' + exams.length + ' 场考试')) : '当前没有可参加的考试';
      } catch {
        if (entering) return;
        button.disabled = true;
        list.hidden = true;
        status.textContent = '暂时无法查询考试，稍后会自动重试';
      } finally {
        checking = false;
      }
    }
    window.addEventListener('pageshow', () => { prepared = null; entering = false; select.disabled = false; refreshExams(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshExams(); });
    setInterval(refreshExams, 15000);
  </script>
</body>
</html>
