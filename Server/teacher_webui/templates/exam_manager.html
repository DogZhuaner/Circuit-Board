{% raw %}
<script type="text/x-template" id="exam-manager-template">
  <div class="modal teaching-backdrop" :inert="!!editorMode" :aria-hidden="editorMode ? 'true' : null"
       @keydown.esc.stop="$emit('close')">
    <div class="modal-content roster teaching-dialog" role="dialog" aria-modal="true" aria-labelledby="exam-manager-title"
         tabindex="-1" ref="dialog" @keydown.tab="trapFocus">
      <header class="roster-banner">
        <div class="roster-emblem"><i class="bi bi-calendar-event"></i></div>
        <div><h2 id="exam-manager-title">管理考试</h2><span>查看考试安排，开考前可调整内容、规则和班级</span></div>
        <button type="button" class="roster-close" aria-label="关闭管理考试" @click="$emit('close')"><i class="bi bi-x-lg"></i></button>
      </header>
      <div v-if="loginRequired" class="teach-message">请先登录教师账号以管理自己发布的考试。 <a href="/">教师登录</a></div>
      <section v-else class="exam-manager-body">
        <div class="exam-list-heading">
          <h3>我发布的考试 <small v-if="!loading && !error">{{ exams.length }} 场</small></h3>
          <button type="button" class="roster-primary" :disabled="loading" @click="openEditor(null, $event.currentTarget)">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> 新增考试
          </button>
        </div>
        <p v-if="notice" class="teach-message" role="status">{{ notice }}</p>
        <p v-if="error" class="teach-message teach-error" role="alert">{{ error }}
          <button class="roster-link" @click="refresh">重新加载</button></p>
        <p v-else-if="loading && !exams.length" class="teach-empty" role="status">正在读取考试…</p>
        <p v-else-if="!exams.length" class="teach-empty">还没有发布考试</p>
        <div v-else class="exam-manager-list">
          <article class="teach-block exam-item" v-for="exam in exams" :key="exam.id">
            <div class="exam-item-heading">
              <h4>{{ exam.test_name }}</h4>
              <span class="exam-status" :data-state="status(exam)">{{ status(exam) }}</span>
            </div>
            <dl class="exam-facts">
              <dt>考试时间</dt><dd>{{ formatTime(exam.publish_time) }} 至 {{ formatTime(exam.deadline_time) }}</dd>
              <dt>参考班级</dt><dd>{{ exam.class_restricted ? (exam.classes.map(c => c.name).join('、') || '暂无参考班级') : '全部学生' }}</dd>
            </dl>
            <div class="exam-item-actions">
              <details :open="!!openDetails[exam.id]" @toggle="openDetails[exam.id] = $event.target.open"><summary>考试详情</summary>
                <dl class="exam-facts"><dt>规则文件</dt><dd>{{ exam.rule_filename || '尚未指定接线规则' }}</dd>
                  <dt>考试内容</dt><dd class="exam-content-text">{{ exam.exam_content || '未填写' }}</dd></dl>
                <ended-exam-scores v-if="openDetails[exam.id] && status(exam) === '已结束'" :exam-id="exam.id"></ended-exam-scores>
              </details>
              <button :disabled="deletingId !== null" v-if="status(exam) === '未开始'" type="button" class="roster-edit" @click="openEditor(exam, $event.currentTarget)">
                <i class="bi bi-pencil" aria-hidden="true"></i> 编辑考试
              </button>
              <button v-if="status(exam) !== '已结束'" type="button" class="roster-delete" :disabled="deletingId !== null" @click="removeExam(exam)">
                <i class="bi bi-trash" aria-hidden="true"></i> 删除考试
              </button>
            </div>
          </article>
        </div>
      </section>
    </div>
  </div>
  <teaching-dialog v-if="editorMode" mode="exam" :signed-in="signedIn" :initial-exam="editing"
      :locked="!!editing && status(editing) !== '未开始'" @saved="onSaved" @close="closeEditor"></teaching-dialog>
</script>
<script type="text/x-template" id="ended-exam-scores-template">
  <section class="ended-exam-scores" aria-label="考生成绩">
    <h5>考生成绩</h5>
    <p v-if="loading" role="status">正在读取成绩…</p>
    <p v-else-if="error" role="alert">{{ error }} <button class="roster-link" @click="load">重试</button></p>
    <p v-else-if="!rows.length">暂无参考学生或已提交成绩</p>
    <template v-else>
      <p>已提交 {{ rows.filter(row => row.score !== null).length }} 人 · 无成绩 {{ rows.filter(row => row.score === null).length }} 人</p>
      <div class="exam-grade-scroll">
        <table class="roster-table"><thead><tr><th>姓名</th><th>学号</th><th>成绩</th><th>接线记录</th></tr></thead>
          <tbody v-for="row in rows" :key="row.sno">
            <tr><td>{{ row.name || '—' }}<small v-if="row.candidate" class="exam-candidate-ref">{{ row.candidate }}</small></td><td>{{ row.sno }}</td>
              <td :class="{ 'grade-missing': row.score === null }">{{ row.score === null ? '无成绩' : row.score + ' 分' }}</td>
              <td><button v-if="row.review_url" type="button" class="roster-link" :aria-expanded="activeReview === row.sno"
                    @click="activeReview = activeReview === row.sno ? null : row.sno">{{ activeReview === row.sno ? '收起回顾' : '接线回顾' }}</button>
                <span v-else class="grade-missing">{{ row.score === null ? '—' : '暂无记录' }}</span></td>
            </tr>
            <tr v-if="activeReview === row.sno"><td colspan="4">
              <iframe class="exam-wiring-review" :src="row.review_url" :title="(row.name || row.sno) + '的接线回顾'"></iframe>
            </td></tr>
          </tbody>
        </table>
      </div>
    </template>
    <a v-if="!loading && !error && analysisUrl" class="roster-primary exam-analysis-link" :href="analysisUrl">
      <i class="bi bi-bar-chart" aria-hidden="true"></i> 查看详细分析
    </a>
  </section>
</script>
{% endraw %}
